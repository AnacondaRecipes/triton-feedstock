{% set version = "3.9.0" %}
# Pre-release pin: no v3.9.0 tag yet. PyTorch 2.15 pins this release/3.9.x commit
# (.ci/docker/ci_commit_pins/triton.txt). Switch to the v3.9.0 tag before merge.
{% set commit = "aad2a60d958f945420c5c40936b37d411fb02e89" %}
# LLVM commit triton 3.9.0 is built against (cmake/llvm-info.json). We build it
# from source (second source entry below) for a hermetic build instead of
# letting triton download its prebuilt LLVM image at build time.
{% set llvm_commit = "b010a18d2b648cab83c83967ff26b8fde11acdc6" %}

package:
  name: triton
  version: {{ version }}

source:
  - url: https://github.com/triton-lang/triton/archive/{{ commit }}.tar.gz
    sha256: afbe1e2f172f3f95f6b58d2ff1006bb0388416de6f966ac7884ea1345f3286f9
    patches:
      - patches/0001-Remove-Werror-that-cause-false-positive-build-failur.patch
      - patches/0003-Use-system-PATH-to-find-tools-in-CONDA_PREFIX.patch
      - patches/0004-Add-conda-forge-include-dirs-to-list-of-include-dirs.patch
      - patches/0005-Install-only-the-nvidia-Python-backend.patch
  - url: https://github.com/llvm/llvm-project/archive/{{ llvm_commit }}.tar.gz
    sha256: 975ad64f584955a714bddd1a3413db14ba3c8cca8292dc020ab58ac4c09decad
    folder: llvm-project
  # nlohmann_json (host, header-only, compiled into libproton) ships its MIT text only in its info/ dir
  - url: https://raw.githubusercontent.com/nlohmann/json/v3.12.0/LICENSE.MIT
    sha256: 46a65cffd1ea955132d95a8dd921640714a8d6b537d2e4e482d31145ae95b603
    folder: host-licenses/nlohmann_json

build:
  number: 0
  # We only use this (and can test this) for pytorch: linux + x86_64 + NVIDIA GPU.
  # Upstream lists only Linux as a supported platform (no Windows wheels); CPU support is under development.
  # TODO: Await support on CI for aarch64 when 2.34 GLIBC (Rocky Linux 9) is available.
  # Upstream supports py3.11–3.15 (setup.py MIN_PYTHON=(3,11), MAX_PYTHON=(3,15)).
  skip: true  # [not (linux and x86_64) or cuda_compiler_version == "None" or py<311 or py>315]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  # upstream setup.py console_scripts
  entry_points:
    - proton = triton.profiler.proton:main
    - proton-viewer = triton.profiler.viewer:main

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
    - ninja-base
    # upstream pyproject.toml requires cmake>=3.20,<4.0
    - cmake >=3.20,<4.0
    # setup.py's is_git_repo() probe shells out to `git` and upstream only catches
    # CalledProcessError, not FileNotFoundError — so the git binary must be present
    # even for tarball builds. Backends are in-tree (no .gitmodules), so nothing is
    # actually fetched; git is only needed to keep the probe from crashing.
    - git
  host:
    - python
    # upstream pyproject.toml requires nanobind==2.10.2
    - nanobind 2.10.2
    - nanobind-abi 17  # NB_INTERNALS_VERSION of nanobind 2.10.2; run_exports pins it at runtime
    - pip
    - setuptools
    - zlib {{ zlib }}
    - zstd {{ zstd }}                # required to build LLVM from source
    - nlohmann_json 3.12.0
    - cuda-cupti-dev  # analint: host_section_needs_exact_pinnings  # floats with cuda-version; exact pin would break the multi-CUDA matrix
    - cuda-version {{ cuda_compiler_version }}
  run:
    - python
    - cuda-nvcc-tools
    - cuda-cuobjdump
    - cuda-cudart
    - cuda-cupti

# The upstream pytest suite needs pytorch (whose CUDA build depends on triton) and a
# GPU; PyTorch's own tests cover that. These tests need neither.
test:
  imports:
    - triton
    - triton._C.libtriton
    - triton.backends.nvidia.compiler
  requires:
    - pip
  commands:
    - pip check
    # proton-viewer is not run: it needs pandas and llnl-hatchet, which upstream leaves optional
    - proton --help
    - test -f $SP_DIR/triton/backends/nvidia/lib/libdevice.10.bc
    - test ! -d $SP_DIR/triton/backends/amd
    # Compile (no GPU needed) for sm_80 and sm_90: runs libtriton's MLIR/LLVM pipeline
    # and ptxas. arch >= 90 asks for ptxas-blackwell, which patch 0003 maps to ptxas.
    - |
      python - <<'EOF'
      import os, tempfile, triton
      from triton.backends.compiler import GPUTarget
      src = """
      module attributes {"ttg.num-warps" = 4 : i32, "ttg.threads-per-warp" = 32 : i32, "ttg.num-ctas" = 1 : i32} {
        tt.func public @empty_kernel(%arg0: !tt.ptr<i32>) {
          tt.return
        }
      }
      """
      for arch in (80, 90):
          with tempfile.TemporaryDirectory() as tmp:
              path = os.path.join(tmp, "empty_kernel.ttgir")
              with open(path, "w") as f:
                  f.write(src)
              k = triton.compile(path, target=GPUTarget("cuda", arch, 32))
              assert f".target sm_{arch}" in k.asm["ptx"], arch
              assert k.asm["cubin"], arch
      EOF

about:
  home: https://github.com/triton-lang/triton
  # triton (MIT) with statically linked LLVM/MLIR/lld (Apache-2.0 WITH LLVM-exception) and
  # LLVM's third-party Support routines (xxhash BSD-2-Clause, ConvertUTF Unicode-DFS-2015,
  # regex BSD-3-Clause, strlcpy ISC), f2reduce (MIT), nanobind (BSD-3-Clause), nanobind's
  # robin_map (MIT) and nlohmann_json (MIT, compiled into libproton)
  license: MIT AND Apache-2.0 WITH LLVM-exception AND BSD-3-Clause AND BSD-2-Clause AND ISC AND Unicode-DFS-2015
  license_family: Other
  license_file:
    - LICENSE
    - llvm-project/llvm/LICENSE.TXT
    - llvm-project/mlir/LICENSE.TXT
    - llvm-project/lld/LICENSE.TXT
    - third_party/f2reduce/LICENCE.txt
    - host-licenses/nanobind-LICENSE          # copied in build.sh
    - host-licenses/robin_map-LICENSE         # extracted in build.sh
    - host-licenses/nlohmann_json/LICENSE.MIT  # source entry
    - host-licenses/nlohmann_json-COPYRIGHTS  # collected in build.sh
    - host-licenses/llvm-support-LICENSES     # extracted in build.sh
  summary: Development repository for the Triton language and compiler
  description: |
    This is the development repository of Triton, a language and compiler for writing highly efficient custom Deep-Learning primitives.
    The aim of Triton is to provide an open-source environment to write fast code at higher productivity than CUDA, but also with higher flexibility than other existing DSLs.
  doc_url: https://triton-lang.org/
  dev_url: https://github.com/triton-lang/triton

extra:
  recipe-maintainers:
    - erip
    - h-vetinari
