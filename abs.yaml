# Hermetic build compiles LLVM (+clang) from source. Observed ~1h15m, but
# from-source builds vary by worker; a 3h cap gives margin over the default 2h.
task_timeout: 10800

# disable tests on initial build due to circular dependency with pytorch cuda.
build_parameters:
  - "--suppress-variables"
  - "--skip-existing"
  - "--error-overlinking"
  - "--no-test"
