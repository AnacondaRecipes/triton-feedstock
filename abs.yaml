# Hermetic build compiles LLVM (+clang) from source. Observed ~1h15m, but
# from-source builds vary by worker; a 3h cap gives margin over the default 2h.
task_timeout: 10800

build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315 : yes

build_parameters:
  - "--suppress-variables"
  - "--skip-existing"
  - "--error-overlinking"
